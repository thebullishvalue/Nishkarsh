name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 2 * * *"          # nightly: Monte-Carlo size/power suite
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
  PYTHONHASHSEED: "0"

jobs:
  fast:
    name: tests (fast)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Numba cache
        uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ hashFiles('analytics/**/*.py', 'requirements.txt') }}
      - name: pytest (not slow)
        run: pytest -m "not slow" -q

  slow:
    name: tests (slow / Monte-Carlo)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest (slow)
        run: pytest -m slow -q
