# Nishkarsh — production Streamlit settings.

[server]
# No file watching / rerun-on-save in production (also avoids inotify limits on hosts).
fileWatcherType = "none"
runOnSave = false
headless = true
# Sheet uploads (CSV/XLSX) — tens of thousands of rows fit well under this.
maxUploadSize = 25
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Exception types + generic messages only in the browser; full tracebacks stay in the
# server log (tracebacks can carry URLs / paths).
showErrorDetails = "type"
toolbarMode = "minimal"

[runner]
magicEnabled = false

[theme]
base = "dark"
# Product typography: Inter for text, IBM Plex Mono for code/numerals; Obsidian palette + amber accent.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
primaryColor = "#D4A853"
backgroundColor = "#050810"
secondaryBackgroundColor = "#111827"
textColor = "#E8EDF5"
